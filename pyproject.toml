[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent"
version = "0.3.4"
description = "Sub-30-second lead reply API + browser automation"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Brighton-Lyrax", email = "operators@replypilot.io"}
]
keywords = ["lead", "automation", "browser", "api", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["fastapi==0.115.0", "uvicorn==0.32.0", "pydantic==2.9.2"]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Homepage = "https://github.com/Brighton-Lyrax/browser-agent"
Repository = "https://github.com/Brighton-Lyrax/browser-agent"
Issues = "https://github.com/Brighton-Lyrax/browser-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "landing/*"]
